name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Build before Typecheck: Next.js generates ambient types (route params,
      # LayoutProps, etc.) under .next/types on first build/dev run, and
      # src/app/layout.tsx's `LayoutProps<"/">` depends on them — a bare
      # `tsc --noEmit` on a fresh checkout fails with "Cannot find name
      # 'LayoutProps'" before that exists. `next build` both generates those
      # types and does its own internal type-check, so it doubles as the
      # first (and stricter) type-check pass.
      - name: Build
        env:
          # Dummy values — nothing in the build touches a live database or
          # calls auth() at build time, this just satisfies env validation.
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
          AUTH_SECRET: "ci-build-placeholder-secret"
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
