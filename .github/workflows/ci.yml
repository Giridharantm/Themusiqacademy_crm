name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        env:
          # Dummy values — nothing in the build touches a live database or
          # calls auth() at build time, this just satisfies env validation.
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
          AUTH_SECRET: "ci-build-placeholder-secret"
        run: npm run build
